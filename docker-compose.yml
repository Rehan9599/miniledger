services:
  postgres:
    image: postgres:16-alpine
    container_name: miniledger-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: miniledger
      POSTGRES_PASSWORD: miniledger123
      POSTGRES_DB: miniledger
    volumes:
      - miniledger_pgdata:/var/lib/postgresql/data

volumes:
  miniledger_pgdata:
